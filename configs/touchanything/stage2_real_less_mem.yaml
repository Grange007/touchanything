name: "touchanything/reconstruction"
tag: &tag "camera-stage2-4090"
exp_root_dir: "outputs/touchanything"
seed: 0

data_type: "dtu-datamodule-plane-batch"
data:
  root_dir: examples/data/record_printed_camera_sample20
  json_path: sample_20_noaxis_8.json
  height: 240
  width: 320
  batch_size: 32
  stage1_batch_size: -1
  # Cycle through four real views per step instead of retaining all views.
  stage2_batch_size: 4
  scale_radius: 3.0
  load_preprocessed: false
  cam_scale_factor: 1
  max_num_frames: 300
  use_mask: true
  box_crop: true
  box_crop_mask_thr: 0.4
  box_crop_context: 0.1
  train_split: "train"
  val_split: "val"
  test_split: "test"
  render_path: "circle"
  include_mono_prior: true
  include_foreground_mask: true
  train_num_rays: -1
  random_camera:
    # 512px with one random view keeps the guidance graph within 24 GB VRAM.
    batch_size: 1
    width: 512
    height: 512
    camera_distance_range: [2.5, 3.0]
    n_val_views: 4
    elevation_range: [-80, 80]
    eval_height: 512
    eval_width: 512
    eval_elevation_deg: 0.0
    eval_camera_distance: 3.0
    eval_fovy_deg: 40.0
    open3d_coord: false
    relative_radius: false

system_type: "touchanything-reconstruction-system"
system:
  latent_steps: 0
  texture: false
  do_init: false

  geometry_convert_inherit_texture: true
  geometry_type: "tetrahedra-sdf-grid"
  geometry_convert_from: null
  geometry:
    radius: 1.0
    isosurface_resolution: 256
    isosurface_deformable_grid: true
    nerf_scale: 1.0
    pos_encoding_config:
      otype: ProgressiveBandHashGrid
      n_levels: 16
      n_features_per_level: 2
      log2_hashmap_size: 20
      base_resolution: 16
      per_level_scale: 1.447269237440378
      start_level: 8
      start_step: 2000
      update_steps: 500
    fix_geometry: false
    n_feature_dims: 3

  material_type: "no-material"
  material:
    n_output_dims: 3
    requires_normal: true

  background_type: "solid-color-background"

  renderer_type: "nvdiff-rasterizer"
  renderer:
    context_type: "cuda"
    depth_norm_radius: ${system.geometry.radius}

  prompt_processor_type: "stable-diffusion-prompt-processor"
  prompt_processor:
    pretrained_model_name_or_path: "pretrained_models/AI-ModelScope/stable-diffusion-2-1-base"
    prompt: "A camera"

  guidance_type: "stable-diffusion-guidance"
  guidance:
    pretrained_model_name_or_path: "pretrained_models/AI-ModelScope/stable-diffusion-2-1-base"
    guidance_scale: 35.0
    weighting_strategy: fantasia3d
    min_step_percent: 0.02
    max_step_percent: 0.5
    collect_inputs: ["comp_normal_cam_vis"]

  freq:
    n_ref: 2
    ref_only_steps: 0
    guidance_eval: 200

  loggers:
    wandb:
      enable: false
      project: "touchanything"
      name: *tag

  loss:
    lambda_rgb_sd: [0, 1, 1, 10000]
    lambda_rgb_sds: 0.01
    lambda_rgb: 0.0
    lambda_mask: 0.0
    depth_truncation: 0.1
    lambda_depth: 25.0
    lambda_freespace: 0
    lambda_sdf: 0.0
    lambda_depth_rel: 0.0
    lambda_depth_normal: 0.0
    lambda_normal: 5.0
    lambda_normal_smooth: 0.0
    lambda_eikonal: 0.0
    lambda_3d_normal_smooth: 0.0
    lambda_orient: 0
    lambda_sparsity: 0.0
    lambda_opaque: 0.0
    lambda_z_variance: 0.0
    lambda_normal_consistency: 100

  optimizer:
    name: AdamW
    args:
      lr: 0.01
      betas: [0.9, 0.99]
      eps: 1.e-15
    params:
      geometry:
        encoding:
          lr: 0.01
        sdf_network:
          lr: 0.001
        feature_network:
          lr: 0.001
      background:
        lr: 0.001
      renderer:
        lr: 0.001

trainer:
  max_steps: 4000
  log_every_n_steps: 100
  # Avoid allocating a separate validation graph before the first train step.
  num_sanity_val_steps: 0
  val_check_interval: 200
  enable_progress_bar: true
  precision: 16-mixed

checkpoint:
  save_last: true
  save_top_k: -1
  every_n_train_steps: ${trainer.max_steps}
