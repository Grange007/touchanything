name: "touchanything/reconstruction"
tag: &tag "camera-stage1"
exp_root_dir: "outputs/touchanything"
seed: 0

data_type: "dtu-datamodule-plane-batch"
data:
  root_dir: examples/data/record_printed_camera_sample20
  json_path: sample_20_noaxis_8.json
  height: 240
  width: 320
  n_view: 4
  batch_size: 32
  stage1_batch_size: -1
  stage2_batch_size: 4
  scale_radius: 3.0
  load_preprocessed: false
  cam_scale_factor: 1
  max_num_frames: 300
  use_mask: true
  box_crop: true
  box_crop_mask_thr: 0.4
  box_crop_context: 0.1
  train_num_rays: 16384
  train_split: "train"
  val_split: "val"
  test_split: "test"
  render_path: "circle"
  include_mono_prior: true
  include_foreground_mask: true
  random_camera:
    batch_size: 8
    width: 64
    height: 64

    camera_distance_range: [2.5, 3.0] #
    n_val_views: 4
    elevation_range: [-80, 80]
    eval_height: 256
    eval_width: 256
    eval_elevation_deg: 0.
    eval_camera_distance: 3.0
    eval_fovy_deg: 40.
    open3d_coord: false
    relative_radius: false


system_type: "touchanything-reconstruction-system"
system:
  latent_steps: 0
  texture: False
  do_init: False

  # geometry_type: "implicit-volume"
  # geometry:
  #   radius: 1.0
  #   normal_type: "analytic"

  #   density_bias: "blob_magic3d"
  #   density_activation: softplus
  #   density_blob_scale: 10.
  #   density_blob_std: 0.5

  #   pos_encoding_config:
  #     otype: HashGrid
  #     n_levels: 16
  #     n_features_per_level: 2
  #     log2_hashmap_size: 19
  #     base_resolution: 16
  #     per_level_scale: 1.447269237440378 # max resolution 4096

  geometry_type: "implicit-sdf"
  geometry:
    radius: 1.0
    normal_type: finite_difference
    # progressive eps from Neuralangelo
    finite_difference_normal_eps: progressive

    sdf_bias: sphere
    sdf_bias_params: 0.3

    # coarse to fine hash grid encoding
    pos_encoding_config:
      otype: ProgressiveBandHashGrid
      n_levels: 16
      n_features_per_level: 2
      log2_hashmap_size: 20
      base_resolution: 16
      per_level_scale: 1.447269237440378 # max resolution 4096
      start_level: 8 # resolution ~200
      start_step: 1000
      update_steps: 400


  material_type: "no-material"
  material:
    n_output_dims: 3
    requires_normal: true

  background_type: "solid-color-background"
  background:
    learned: true

  # renderer_type: "nerf-volume-renderer"
  # renderer:
  #   radius: ${system.geometry.radius}
  #   num_samples_per_ray: 512
  #   camera_distance_range: ${data.camera_distance_range}
  #   return_comp_normal: True
  #   occ_grid_res: 32
  #   depth_norm_radius: 1.0

  renderer_type: "neus-volume-renderer"
  renderer:
    radius: ${system.geometry.radius}
    num_samples_per_ray: 512
    cos_anneal_end_steps: ${trainer.max_steps}
    eval_chunk_size: 8192
    return_comp_normal: True
    occ_grid_res: 64
    near_plane: 0.001
    far_plane: 5.0

  prompt_processor_type: "stable-diffusion-prompt-processor"
  prompt_processor:
    pretrained_model_name_or_path: "pretrained_models/AI-ModelScope/stable-diffusion-2-1-base"
    prompt: "A camera"

  guidance_type: "stable-diffusion-guidance"
  guidance:
    pretrained_model_name_or_path: "pretrained_models/AI-ModelScope/stable-diffusion-2-1-base"
    guidance_scale: 35.0
    weighting_strategy: fantasia3d

    min_step_percent: [0, 0.05, 0.02, 6000]  # (start_iter, start_val, end_val, end_iter)
    max_step_percent: [0, 0.50, 0.20, 6000]

    collect_inputs_lat: ['comp_rgb', 'opacity']
    collect_inputs: ['comp_normal_cam_vis']

  freq:
    n_ref: 2
    ref_only_steps: 1000
    guidance_eval: 1000

  loggers:
    wandb:
      enable: false 
      project: "touchanything"
      name: *tag

  loss:
    lambda_rgb_sd: [0, 1, 1, 10000]

    lambda_rgb_sds: 0.01
    lambda_rgb: 0.
    lambda_mask: 0.0
    depth_truncation: 0.1
    lambda_depth: 20.0
    lambda_freespace: 0.0
    lambda_sdf: 12000.0
    lambda_depth_rel: 0.0
    lambda_depth_normal: 0.0
    lambda_normal: [0, 0.1, 4, 6000]
    lambda_normal_smooth: 0.0
    lambda_eikonal: 0.5
    lambda_3d_normal_smooth: 0.0
    # lambda_orient: [0, 10., 1000., 5000]
    lambda_orient: 0
    lambda_sparsity: 0.0
    lambda_opaque: 0.
    lambda_z_variance: 0.
    lambda_normal_consistency: 0

  # optimizer:
  #   name: AdamW
  #   args:
  #     betas: [0.9, 0.99]
  #     eps: 1.e-15
  #     lr: 0.01
  #   params:
  #     geometry.encoding:
  #       lr: 0.01
  #     geometry.density_network:
  #       lr: 0.001
  #     geometry.feature_network:
  #       lr: 0.001
  #     background:
  #       lr: 0.001

  optimizer:
    name: AdamW
    args:
      betas: [0.9, 0.99]
      eps: 1.e-15
    params:
      geometry:
        encoding:
          lr: 0.01
        sdf_network:
          lr: 0.001
        feature_network:
          lr: 0.001
      background:
        lr: 0.001
      renderer:
        lr: 0.001


trainer:
  max_steps: 7000
  log_every_n_steps: 100
  num_sanity_val_steps: 0
  val_check_interval: 200
  enable_progress_bar: true
  precision: 16-mixed

checkpoint:
  save_last: true
  save_top_k: -1
  every_n_train_steps: ${trainer.max_steps}
